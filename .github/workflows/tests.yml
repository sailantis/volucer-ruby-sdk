name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.3", "head"]

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Unit and wire-format tests
        # `bundle exec`, not a bare `rake`: the release workflow runs `bundle exec rake
        # release`, so anything that only works outside bundler is a release that fails
        # after the tag is pushed. Two real bugs hid behind that gap -- `rake` itself was
        # missing from the bundle, and the gemspec required `lib/volucer`, which rewrites
        # `$stdout` on every `bundle` command.
        run: bundle exec rake test

  # The end-to-end suite drives a real server, so it is its own job: a build failure is then
  # reported as itself, and it cannot be gated off by editing the matrix above. It used to be
  # four steps inside `test` guarded by `if: matrix.ruby == '3.3'`; when that pinned version
  # leaves the matrix the condition stops matching, every job skips those steps, and the
  # workflow stays green while proving nothing -- which is exactly what happened to the Python
  # SDK's copy of this shape. A version pinned in a job that has no matrix cannot drift.
  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      # The end-to-end suite drives a real server, and VOLUCER_E2E=1 is what makes it fail
      # rather than skip — the same convention the server's own suites and the other SDKs use.
      - name: Check out the server beside the SDK
        uses: actions/checkout@v4
        with:
          repository: sailantis/volucer
          path: volucer

      # NASM and CMake are what the server's `aws-lc-sys` backend needs to assemble crypto code.
      # This workflow never installed them, so the build step below could not have succeeded.
      - name: Install the server's build dependencies
        run: sudo apt-get update && sudo apt-get install -y nasm cmake build-essential

      - name: Build the server
        run: cargo build --manifest-path volucer/Cargo.toml

      - name: End-to-end against the real server
        run: |
          test -x "$PWD/volucer/target/debug/volucer" || {
            echo "the server did not build, so there is nothing for the suite to talk to"
            exit 1
          }
          VOLUCER_BIN="$PWD/volucer/target/debug/volucer" \
          VOLUCER_E2E=1 \
          ruby -Ilib -Itest test/test_end_to_end.rb
